<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeSim 2026 · 인생 시뮬레이터</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 시작 화면 -->
    <section id="screen-start" class="screen active">
      <div class="hero">
        <h1>LifeSim <span class="year">2026</span></h1>
        <p class="tagline">2026년 대한민국. 당신의 인생을 채팅으로 살아가세요.<br/>하고 싶은 무엇이든 입력하면 이야기가 펼쳐집니다.</p>
      </div>
      <div class="card setup">
        <label>이름 <input id="in-name" placeholder="비워두면 랜덤" maxlength="12" /></label>
        <label>성별
          <select id="in-gender">
            <option value="">랜덤</option>
            <option value="남성">남성</option>
            <option value="여성">여성</option>
          </select>
        </label>
        <label>시작 나이 <input id="in-age" type="number" min="14" max="70" value="20" /></label>
        <label>배경 한 줄 <input id="in-bg" placeholder="예: 지방 출신 대학 휴학생 (선택)" maxlength="60" /></label>

        <details class="ai-box" id="ai-box">
          <summary>🤖 AI 모드 설정 (OpenAI API 키)</summary>
          <label>API 키
            <input id="in-key" type="password" placeholder="sk-... (입력 시 AI가 이야기를 생성)" autocomplete="off" />
          </label>
          <label>모델
            <select id="in-model">
              <option value="gpt-4o">gpt-4o (균형·추천)</option>
              <option value="gpt-4o-mini">gpt-4o-mini (빠름·저렴)</option>
              <option value="gpt-4.1">gpt-4.1 (고품질)</option>
            </select>
          </label>
          <label class="check"><input id="in-remember" type="checkbox" /> 이 브라우저에 키 기억하기</label>
          <p class="hint">키는 로컬 서버 메모리에서만 사용됩니다. '기억하기'를 켜면 이 브라우저(localStorage)에만 저장됩니다. 비워두면 내장 폴백 엔진으로 플레이합니다.</p>
        </details>

        <button id="btn-start" class="primary">인생 시작하기</button>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="screen-game" class="screen">
      <header class="topbar">
        <div class="who">
          <strong id="g-name">—</strong>
          <span id="g-meta" class="meta">—</span>
        </div>
        <div class="topright">
          <span id="g-ai-badge" class="ai-badge"></span>
          <div class="net"><span class="net-label">순자산</span><span id="g-net" class="money">—</span></div>
        </div>
      </header>

      <div class="stats" id="g-stats"></div>

      <div class="main-grid">
        <!-- 채팅 -->
        <section class="chat-panel">
          <div id="chat-log" class="chat-log"></div>
          <div id="suggestions" class="suggestions"></div>
          <div class="chat-input">
            <input id="chat-text" placeholder="무엇을 할까요? (예: 카페 창업 자금을 알아본다)" maxlength="200" />
            <button id="chat-send">▶</button>
          </div>
        </section>

        <!-- 탭 패널 -->
        <aside class="tabs-panel">
          <nav class="tabs" id="tabs"></nav>
          <div class="tab-body" id="tab-body"></div>
        </aside>
      </div>
    </section>

    <!-- 사망 화면 -->
    <section id="screen-end" class="screen">
      <div class="card end">
        <h1>🕯️ 인생의 끝</h1>
        <p id="end-summary">—</p>
        <ul id="end-log" class="log"></ul>
        <button id="btn-restart" class="primary">새 인생 시작</button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
